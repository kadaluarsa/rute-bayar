openapi: 3.1.0
info:
  title: Rute Bayar API
  version: 1.0.0
  description: |
    HTTP API v1 for payments, webhooks, forwarding targets/attempts, and operations.
    Service runs in three daemon modes: webhook, api, all.
    MCP mapping notes are included under x-mcp-operation for each route.
servers:
  - url: http://localhost:8080
    description: Local daemon server
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Three roles (Wishpull v0.3): admin (RUTE_BAYAR_API_KEY), agent
        (RUTE_BAYAR_AGENT_API_KEY) and executor (RUTE_BAYAR_EXECUTOR_API_KEY).
        The key may also be sent as "Authorization: Bearer <key>".
  schemas:
    StandardResponse:
      type: object
      required:
        - request_id
        - timestamp
      properties:
        request_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          required:
            - error_code
            - message
          properties:
            error_code:
              type: string
              enum: [bad_request, unauthorized, forbidden, not_found, conflict, rate_limited, internal_error]
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    ProviderAccount:
      type: object
      required:
        - id
        - provider
        - environment
      properties:
        id:
          type: string
        provider:
          type: string
          enum: [midtrans, xendit, doku, ipaymu]
        environment:
          type: string
          enum: [sandbox, production]
        display_name:
          type: string
        credential_json:
          type: object
          additionalProperties: true
        config_json:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaymentIntent:
      type: object
      required:
        - reference
        - provider
      properties:
        reference:
          type: string
        provider:
          type: string
          enum: [midtrans, xendit, doku, ipaymu]
        environment:
          type: string
          enum: [sandbox, production]
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          default: IDR
        method:
          type: string
        channel:
          type: string
        customer_name:
          type: string
        customer_email:
          type: string
        customer_phone:
          type: string
        notification_url:
          type: string
          format: uri
    PaymentAttempt:
      type: object
      properties:
        id:
          type: string
        payment_reference:
          type: string
        provider:
          type: string
        provider_reference:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
    RefundResult:
      type: object
      properties:
        id:
          type: string
        payment_reference:
          type: string
        provider:
          type: string
        status:
          type: string
        amount:
          type: integer
        request_id:
          type: string
    WebhookEvent:
      type: object
      required:
        - id
        - provider
      properties:
        id:
          type: string
        provider:
          type: string
          enum: [midtrans, xendit, doku, ipaymu]
        provider_event_id:
          type: string
        event_type:
          type: string
        signature_valid:
          type: boolean
        processing_status:
          type: string
        received_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
          nullable: true
        payload_json:
          type: object
          additionalProperties: true
        headers_json:
          type: object
          additionalProperties: true
    ForwardingTarget:
      type: object
      required:
        - id
        - provider
        - name
        - url
      properties:
        id:
          type: string
        provider:
          type: string
          enum: [midtrans, xendit, doku, ipaymu]
        name:
          type: string
        url:
          type: string
          format: uri
        event_filter:
          type: object
          additionalProperties: true
        headers:
          type: object
          additionalProperties: true
        retry_policy:
          type: object
          properties:
            max_attempts:
              type: integer
            timeout_ms:
              type: integer
            backoff_ms:
              type: integer
        enabled:
          type: boolean
          default: true
    ForwardingAttempt:
      type: object
      required:
        - id
        - webhook_event_id
      properties:
        id:
          type: string
        webhook_event_id:
          type: string
        target_id:
          type: string
        target_name:
          type: string
        target_url:
          type: string
        provider:
          type: string
        status:
          type: string
          enum: [success, failed]
        attempt_no:
          type: integer
        request_json:
          type: object
          additionalProperties: true
        response_json:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReconcileResult:
      type: object
      properties:
        provider:
          type: string
        reference:
          type: string
        provider_reference:
          type: string
        local_status:
          type: string
        provider_status:
          type: string
        matched:
          type: boolean
        updated:
          type: boolean
        message:
          type: string
    Stats:
      type: object
      properties:
        totals:
          type: object
          additionalProperties:
            type: integer
        environment:
          type: string
        database_path:
          type: string
        updated_at:
          type: string
          format: date-time
    EnvelopePaymentCreate:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                provider:
                  type: string
                reference:
                  type: string
                status:
                  type: string
    EnvelopeData:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            data:
              nullable: true
    EnvelopeList:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                additionalProperties: true
    EnvelopeMeta:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            data:
              additionalProperties: true
            page:
              type: object
              properties:
                limit:
                  type: integer
                offset:
                  type: integer
                total:
                  type: integer
security:
  - ApiKeyAuth: []
paths:
  /healthz:
    get:
      tags: [ops]
      summary: Daemon health check
      security: []
      responses:
        '200':
          description: healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
  /api/v1/version:
    post:
      tags: [ops]
      summary: API version probe
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: version response
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  api:
                    type: string
  /api/v1/healthz:
    get:
      tags: [ops]
      summary: API health check
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
  /api/v1/provider-accounts:
    get:
      tags: [provider]
      summary: List provider accounts
      parameters:
        - in: query
          name: provider
          schema:
            type: string
        - in: query
          name: environment
          schema:
            type: string
      responses:
        '200':
          description: provider accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeList'
        '401':
          $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [provider]
      summary: Create or update provider account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
                - environment
                - credential_json
              properties:
                provider:
                  type: string
                environment:
                  type: string
                  enum: [sandbox, production]
                display_name:
                  type: string
                credential_json:
                  type: object
                  additionalProperties: true
                config_json:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: upserted account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
        '400':
          $ref: '#/components/schemas/ErrorResponse'
  /api/v1/provider-accounts/{id}:
    put:
      tags: [provider]
      summary: Update provider account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                environment:
                  type: string
                  enum: [sandbox, production]
                credential_json:
                  type: object
                  additionalProperties: true
                config_json:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
      x-mcp-operation: provider-account-update
    delete:
      tags: [provider]
      summary: Delete provider account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
      x-mcp-operation: provider-account-delete
  /api/v1/payments:
    get:
      tags: [payment]
      summary: List payment intents
      parameters:
        - in: query
          name: provider
          schema:
            type: string
        - in: query
          name: environment
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeList'
    post:
      tags: [payment]
      summary: Create payment intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntent'
              
      responses:
        '200':
          description: payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePaymentCreate'
      x-mcp-operation: payment-create
  /api/v1/payments/{reference}:
    get:
      tags: [payment]
      summary: Get payment intent and latest attempt
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: payment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
                
  /api/v1/payments/{reference}/status:
    get:
      tags: [payment]
      summary: Check provider status and reconcile mismatch if needed
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: status fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
        '404':
          $ref: '#/components/schemas/ErrorResponse'
      x-mcp-operation: payment-status
  /api/v1/payments/{reference}/refund:
    post:
      tags: [payment]
      summary: Request refund
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundResult'
      responses:
        '200':
          description: refund requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
  /api/v1/webhook-events:
    get:
      tags: [webhook]
      summary: List webhook events
      parameters:
        - in: query
          name: provider
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: signature_valid
          schema:
            type: boolean
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: webhook events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeMeta'
      x-mcp-operation: webhook-event-list
  /api/v1/webhook-events/{id}:
    get:
      tags: [webhook]
      summary: Get webhook event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: webhook event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
      x-mcp-operation: webhook-event-get
  /api/v1/webhook-events/{id}/forwarding-attempts:
    get:
      tags: [webhook]
      summary: List forwarding attempts for one event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: forwarding attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeList'
      x-mcp-operation: webhook-forwarding-attempts-by-event
  /api/v1/webhook-events/{id}/replay:
    post:
      tags: [webhook]
      summary: Replay webhook event forwarding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: replay initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
      x-mcp-operation: webhook-replay
  /api/v1/webhook-forwarding-targets:
    get:
      tags: [forwarding]
      summary: List forwarding targets
      parameters:
        - in: query
          name: provider
          schema:
            type: string
        - in: query
          name: enabled_only
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: forwarding targets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeList'
      x-mcp-operation: forwarding-target-list
    post:
      tags: [forwarding]
      summary: Create forwarding target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForwardingTarget'
      responses:
        '200':
          description: target created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
      x-mcp-operation: forwarding-target-create
  /api/v1/webhook-forwarding-targets/{id}:
    put:
      tags: [forwarding]
      summary: Update forwarding target
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForwardingTarget'
      responses:
        '200':
          description: target updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
      x-mcp-operation: forwarding-target-update
    delete:
      tags: [forwarding]
      summary: Delete forwarding target
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: target deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
      x-mcp-operation: forwarding-target-delete
  /api/v1/webhook-forwarding-attempts:
    get:
      tags: [forwarding]
      summary: List forwarding attempts
      parameters:
        - in: query
          name: provider
          schema:
            type: string
        - in: query
          name: target_id
          schema:
            type: string
        - in: query
          name: event_id
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: forwarding attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeList'
      x-mcp-operation: forwarding-attempt-list
  /api/v1/reconcile/{provider}/{reference}:
    post:
      tags: [ops]
      summary: Reconcile one payment reference with provider status
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: reconcile result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
      x-mcp-operation: payment-reconcile
  /api/v1/stats:
    get:
      tags: [ops]
      summary: Runtime and data stats
      responses:
        '200':
          description: aggregate stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
  /api/v1/routes/quote:
    post:
      tags: [wishpull-routing]
      summary: RP-1 get_optimized_payment_route (agent, executor, admin)
      description: Recommend a gateway for a method and exact IDR amount, with fee, health and fallback plan. Moves no money.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, preferred_method]
              properties:
                amount: {type: integer, minimum: 1, description: Whole rupiah, never rounded}
                preferred_method: {type: string, example: va_mandiri}
                currency: {type: string, enum: [IDR]}
                user_id: {type: string}
                has_client_token: {type: boolean}
                client_token_provider: {type: string, enum: [midtrans, xendit, doku, ipaymu]}
      responses:
        '200':
          description: route decision (recommended_gateway, estimated_fee, gateway_status, fallbacks, rejected, fallback_policy)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
        '422':
          description: no gateway can serve the method (error_code no_route)
      x-mcp-operation: get_optimized_payment_route
  /api/v1/routes/token:
    post:
      tags: [wishpull-routing]
      summary: RP-2 generate_secure_routing_token (agent, executor, admin)
      description: Re-quotes server-side and pins order, mandate, merchant, cart hash, amount, method and gateways into an HMAC token that never outlives the mandate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, mandate_id, merchant_id, cart_hash, amount, preferred_method, mandate_expires_at]
              properties:
                order_id: {type: string}
                mandate_id: {type: string}
                merchant_id: {type: string}
                cart_hash: {type: string}
                amount: {type: integer, minimum: 1}
                preferred_method: {type: string}
                mandate_expires_at: {type: string, format: date-time}
                user_id: {type: string}
                has_client_token: {type: boolean}
                client_token_provider: {type: string}
      responses:
        '200':
          description: routing_token, token_id, expires_at, pinned_gateways, estimated_fee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
      x-mcp-operation: generate_secure_routing_token
  /api/v1/routes/execute:
    post:
      tags: [wishpull-routing]
      summary: EX-1/EX-2/EX-3 execute a routing token (executor only)
      description: |
        Verifies the token, runs mandateCovers, then calls the pinned gateways with
        double-charge-safe fallback. Idempotent per order_id. Never exposed over MCP.
        data.status is one of issued, mandate_rejected, failed, requires_reconcile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [routing_token, mandate]
              properties:
                routing_token: {type: string}
                mandate:
                  type: object
                  required: [mandate_id, order_id, merchant_id, cart_hash, amount, expires_at]
                  properties:
                    mandate_id: {type: string}
                    order_id: {type: string}
                    merchant_id: {type: string}
                    cart_hash: {type: string}
                    amount: {type: integer}
                    currency: {type: string, enum: [IDR]}
                    expires_at: {type: string, format: date-time}
                    revoked: {type: boolean}
                card_token: {type: string, description: Gateway SDK token produced on the device; never raw card data}
                card_token_provider: {type: string}
                notification_url: {type: string}
                customer:
                  type: object
                  properties:
                    name: {type: string}
                    email: {type: string}
                    phone: {type: string}
      responses:
        '200':
          description: execution outcome (status, provider, instrument, next_action, challenge_required, attempts, violations, replayed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
        '409':
          description: another execution for the order is in progress, or environment mismatch
        '422':
          description: invalid or expired routing token
      x-mcp-operation: none (deterministic workflow only)
  /api/v1/routes/executions/{order_id}:
    get:
      tags: [wishpull-routing]
      summary: Stored execution outcome for an order (executor, admin)
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: execution record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
        '404':
          description: no execution for the order
  /api/v1/gateways/health:
    get:
      tags: [wishpull-routing]
      summary: RP-3 gateway breaker state, success rate and p95 latency (agent, executor, admin)
      responses:
        '200':
          description: per-gateway health snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
      x-mcp-operation: get_gateway_health
  /api/v1/outbound-events:
    get:
      tags: [wishpull-routing]
      summary: Outbox of signed events to Wishpull (admin)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, delivered, dead]
        - name: order_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: outbound events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
  /api/v1/outbound-events/{id}/requeue:
    post:
      tags: [wishpull-routing]
      summary: Move a dead or pending event back to pending now (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: requeued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeData'
  /mcp:
    post:
      tags: [wishpull-routing]
      summary: Model Context Protocol endpoint (JSON-RPC 2.0, Streamable HTTP with JSON responses)
      description: Tools get_optimized_payment_route, generate_secure_routing_token, get_gateway_health, get_payment_status, list_payment_methods. Requires the agent, executor or admin key as a bearer token.
      responses:
        '200':
          description: JSON-RPC response
        '202':
          description: notification accepted
        '401':
          description: missing or invalid key
  /metrics:
    get:
      tags: [ops]
      summary: Prometheus metrics (bearer RUTE_BAYAR_METRICS_TOKEN when set)
      security: []
      responses:
        '200':
          description: Prometheus text exposition format
